[project]
name = "comfy-gen-modal"
version = "0.1.0"
description = "Comfy-Gen-MCP's Modal app: ComfyUI on a GPU in the user's Modal workspace, model seeding, and the build-time deploy script."
requires-python = ">=3.12"
dependencies = ["modal==1.5.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_gen_modal"]
