[project]
name = "comfy-gen-core"
version = "0.1.0"
description = "Comfy-Gen-MCP's brain: packs, workflow building, tool specs, ComfyUI client, MCP handler. Runs under CPython and Pyodide."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# HttpxTransport, for CPython callers (the MCPB, tests). The Worker brings its own fetch transport.
httpx = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_gen_core"]
