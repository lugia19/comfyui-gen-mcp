[project]
name = "comfy-gen-spike-worker"
version = "0.1.0"
description = "Infrastructure spikes S1-S4, S6, S7 in one Python Worker. See ../README.md."
requires-python = ">=3.14"
dependencies = [
    "mcp==2.2.0",
    "comfy-gen-spike-sibling",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]

[tool.uv.sources]
# editable = false: an editable install would vendor a pointer to this machine's filesystem.
comfy-gen-spike-sibling = { workspace = true, editable = false }
