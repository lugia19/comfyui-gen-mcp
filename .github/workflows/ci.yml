name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    # The Python that remains: the Modal app and the build step's deploy.py.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install uv
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest

  node:
    # core, local, the MCPB, the agent and the Worker in TypeScript: typecheck, vitest, and the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node packages/mcpb/build.mjs

  launcher:
    # The PC agent's launcher in Go: the release build and the tests, on each OS it ships for.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/launcher/go.mod
          cache-dependency-path: packages/launcher/go.sum
      - run: npm ci
      - run: node packages/mcpb/build.mjs
      # Copies the shim in for go:embed, and cross-compiles every release target.
      - run: node packages/launcher/build.mjs
      - run: go vet ./... && go test ./...
        working-directory: packages/launcher
        shell: bash

  web:
    # web/dist is committed (deploys have no node); it must match its source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: web/dist matches the source
        run: |
          git add -N web/dist
          git diff --exit-code --stat web/dist || { echo "::error::Rebuild web/dist (cd web && npm run build) and commit it"; exit 1; }

  pack-models:
    # Pack sizes and hashes must match what the URLs serve: the Modal seed trusts the sizes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_pack_models.py
