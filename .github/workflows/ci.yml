name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install uv
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest

  pyodide:
    # core must run under Pyodide, the Cloudflare Python Worker's runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: scripts
      - run: npm run test:pyodide
        working-directory: scripts

  web:
    # web/dist is committed (deploys have no node); it must match its source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: web/dist matches the source
        run: |
          git add -N web/dist
          git diff --exit-code --stat web/dist || { echo "::error::Rebuild web/dist (cd web && npm run build) and commit it"; exit 1; }

  pack-models:
    # Pack sizes and hashes must match what the URLs serve: the Modal seed trusts the sizes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_pack_models.py
