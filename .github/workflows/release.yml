name: Release

# Push a tag like v1.2.3. Installs pick the release up through their daily update check: the
# Worker starts a Workers Build, whose deploy command downloads releases/latest/download/deploy.sh;
# the shim of the Claude Desktop extension and of the PC agent downloads comfy-gen.mjs (design §2).
# The .mcpb and the launchers are downloaded by hand, once. Six files in all; the notes start with a
# download table (.github/release-notes.md).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy.sh pinned to this tag
        run: |
          mkdir -p out
          sed "s/__COMFY_GEN_TAG__/${GITHUB_REF_NAME}/" packages/worker/deploy/deploy.sh > out/deploy.sh
          grep -q "RELEASE_TAG=\"${GITHUB_REF_NAME}\"" out/deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/launcher/go.mod
          cache-dependency-path: packages/launcher/go.sum
      - name: The bundle and the extension
        run: |
          npm ci
          node packages/mcpb/build.mjs "$GITHUB_REF_NAME"
          cp packages/mcpb/dist/comfy-gen.mjs packages/mcpb/dist/Comfy-Gen-MCP.mcpb out/
      - name: The agent's launchers
        run: |
          node packages/launcher/build.mjs "$GITHUB_REF_NAME"
          cp packages/launcher/dist/* out/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out && test "$(ls out | wc -l)" -eq 6
          sed "s/__TAG__/${GITHUB_REF_NAME}/g" .github/release-notes.md > notes.md
          # The download table comes first; GitHub's generated changes follow it.
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
