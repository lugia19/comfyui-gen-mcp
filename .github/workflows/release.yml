name: Release

# Push a tag like v1.2.3. Installs pick the release up through their daily update check: the
# Worker starts a Workers Build, whose deploy command downloads releases/latest/download/deploy.sh;
# the Claude Desktop extension's shim downloads comfy-gen-server.mjs (design §2, "The MCPB process"),
# and the PC agent's shim comfy-gen-agent.mjs. The launchers are downloaded by hand, once.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy.sh pinned to this tag
        run: |
          mkdir -p out
          sed "s/__COMFY_GEN_TAG__/${GITHUB_REF_NAME}/" packages/worker/deploy/deploy.sh > out/deploy.sh
          grep -q "RELEASE_TAG=\"${GITHUB_REF_NAME}\"" out/deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/launcher/go.mod
          cache-dependency-path: packages/launcher/go.sum
      - name: The extension, the agent and their bundles
        run: |
          npm ci
          node packages/mcpb/build.mjs "$GITHUB_REF_NAME"
          cp packages/mcpb/dist/comfy-gen-server.mjs packages/mcpb/dist/comfy-gen-server.mjs.sha256 packages/mcpb/dist/Comfy-Gen-MCP.mcpb out/
          cp packages/mcpb/dist/comfy-gen-agent.mjs packages/mcpb/dist/comfy-gen-agent.mjs.sha256 out/
      - name: The agent's launchers
        run: |
          node packages/launcher/build.mjs "$GITHUB_REF_NAME"
          cp packages/launcher/dist/* out/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
