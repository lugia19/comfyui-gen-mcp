name: Release

# Push a tag like v1.2.3. Installs pick the release up through their daily update check: the
# Worker starts a Workers Build, whose deploy command downloads releases/latest/download/deploy.sh;
# the Claude Desktop extension's shim downloads comfy-gen-server.mjs (design §2, "The MCPB process").

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy.sh pinned to this tag
        run: |
          mkdir -p out
          sed "s/__COMFY_GEN_TAG__/${GITHUB_REF_NAME}/" packages/worker/deploy/deploy.sh > out/deploy.sh
          grep -q "RELEASE_TAG=\"${GITHUB_REF_NAME}\"" out/deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The extension and its server bundle
        run: |
          npm ci
          node packages/mcpb/build.mjs "$GITHUB_REF_NAME"
          cp packages/mcpb/dist/comfy-gen-server.mjs packages/mcpb/dist/comfy-gen-server.mjs.sha256 packages/mcpb/dist/Comfy-Gen-MCP.mcpb out/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/deploy.sh out/comfy-gen-server.mjs out/comfy-gen-server.mjs.sha256 \
            out/Comfy-Gen-MCP.mcpb --title "$GITHUB_REF_NAME" --generate-notes
