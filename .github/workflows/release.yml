name: Release

# Push a tag like v1.2.3. Installs pick the release up through their daily update check: the
# Worker starts a Workers Build, whose deploy command downloads releases/latest/download/deploy.sh;
# the shim of the Claude Desktop extension and of the PC agent downloads comfy-gen.mjs (design §2).
# The .mcpb and the launchers are downloaded by hand, once; the tray helpers by the bundle, for its
# own release. Nine files in all; the notes start with a download table (.github/release-notes.md).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  tray-macos:
    # The macOS tray helper uses Cocoa through cgo, so a Mac builds it; the others cross-compile below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tray/go.mod
          cache-dependency-path: packages/tray/go.sum
      - run: node packages/tray/build.mjs macos
      - uses: actions/upload-artifact@v4
        with:
          name: tray-macos
          path: packages/tray/dist/comfy-gen-tray-macos
          if-no-files-found: error

  release:
    needs: tray-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy.sh pinned to this tag
        run: |
          mkdir -p out
          sed "s/__COMFY_GEN_TAG__/${GITHUB_REF_NAME}/" packages/worker/deploy/deploy.sh > out/deploy.sh
          grep -q "RELEASE_TAG=\"${GITHUB_REF_NAME}\"" out/deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/launcher/go.mod
          cache-dependency-path: |
            packages/launcher/go.sum
            packages/tray/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: tray-macos
          path: packages/tray/dist
      # Before the bundle, which pins their hashes.
      - name: The tray helpers
        run: |
          node packages/tray/build.mjs linux windows
          chmod +x packages/tray/dist/*
          cp packages/tray/dist/* out/
      - name: The bundle and the extension
        run: |
          npm ci
          node packages/mcpb/build.mjs "$GITHUB_REF_NAME"
          cp packages/mcpb/dist/comfy-gen.mjs packages/mcpb/dist/Comfy-Gen-MCP.mcpb out/
      - name: The agent's launchers
        run: |
          node packages/launcher/build.mjs "$GITHUB_REF_NAME"
          cp packages/launcher/dist/* out/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out && test "$(ls out | wc -l)" -eq 9
          sed "s/__TAG__/${GITHUB_REF_NAME}/g" .github/release-notes.md > notes.md
          # The download table comes first; GitHub's generated changes follow it.
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
