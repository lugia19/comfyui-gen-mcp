name: Site

# Publishes site/guide/ to GitHub Pages: Workers load their walkthroughs (guides.json and its
# screenshots) from there. The setup page itself is served by the setup Worker (packages/setup) at
# comfy-setup.lugia19.com, and the old address redirects to it. Needs, once, Settings → Pages →
# Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: The guides, and the setup page's new address
        run: |
          mkdir -p _site
          cp -r site/guide site/favicon.svg _site/
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Comfy-Gen setup</title>
          <meta http-equiv="refresh" content="0; url=https://comfy-setup.lugia19.com/">
          <p>The setup page moved to <a href="https://comfy-setup.lugia19.com/">comfy-setup.lugia19.com</a>.</p>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
