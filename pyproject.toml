[project]
name = "comfyui-gen-mcp-workspace"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
# The Python that remains: the Modal app (runs on Modal and in the Workers Build). core and the
# Worker are TypeScript (npm workspaces); the build step's deploy.py is stdlib-only and tested here.
members = ["packages/modal_app"]

[tool.uv.sources]
comfy-gen-modal = { workspace = true }

[dependency-groups]
dev = [
    "comfy-gen-modal",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/modal_app/tests", "packages/worker/tests"]
addopts = "-q"
